<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TriA — 兩套配色比較</title><style>*{box-sizing:border-box}body{margin:0;background:#dedfdf;color:#303235;font-family:Arial,'Microsoft JhengHei',sans-serif}header{padding:30px 4%;background:#f9f9f8;border-bottom:1px solid #ccc}header p{font-size:10px;letter-spacing:2px;color:#7d8084;margin:0 0 10px}h1{font-size:24px;letter-spacing:2px;font-weight:400;margin:0 0 12px}header>span{font-size:11px;line-height:1.9;color:#767a7f}nav{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}nav button,nav a{font:11px Arial,'Microsoft JhengHei',sans-serif;border:1px solid #c8cbd0;background:#fff;color:#555;padding:10px 16px;cursor:pointer;text-decoration:none}nav button[aria-pressed=true]{background:#303235;color:#fff;border-color:#303235}.compare{display:grid;grid-template-columns:1fr 1fr;gap:22px;padding:25px 3%;align-items:start}.option{min-width:0;box-shadow:0 4px 18px #00000010;background:#fff}.option-heading{padding:22px 25px}.sand .option-heading{background:#faf7f2;color:#302b26}.graphite .option-heading{background:#fafafa;color:#272b30}.option h2{font-size:20px;font-weight:400;margin:0 0 10px;letter-spacing:1px}.option p{font-size:11px;line-height:1.9;margin:0;color:#7b7770}.graphite p{color:#747e89}.swatches{display:flex;gap:7px;margin:17px 0}.swatches span{width:32px;height:20px;border:1px solid #0000000d}.option a{font-size:11px;color:inherit;text-underline-offset:4px}.screen{position:relative;width:100%;overflow:hidden;height:calc(2700px * var(--scale,.4));border-top:1px solid #d3d3d0}.screen iframe{width:1440px;height:2700px;border:0;transform:scale(var(--scale,.4));transform-origin:top left;display:block;background:#fff}.foot{padding:10px 4% 30px;font-size:10px;line-height:2;color:#72777e}@media(max-width:700px){.compare{grid-template-columns:1fr}.option-heading{padding:20px!important}h1{font-size:21px}}</style></head><body><header><p>TRIA PLATFORM / COLOR STUDY</p><h1>相同作品，兩種品牌表情。</h1><span>只比較背景、文字、線條與深色區塊；網站架構與原始照片保持一致。下方為可操作的實際頁面縮覽。</span><nav aria-label="比較頁面"><button data-page="/who" aria-pressed="true">認識公司</button><button data-page="/services/interior" aria-pressed="false">室內作品</button><button data-page="/#services" aria-pressed="false">七大專業</button><button data-page="/#contact" aria-pressed="false">聯絡表單</button><a href="/?palette=original">返回原版淺綠</a></nav></header><main class="compare"><section class="option sand"><div class="option-heading"><h2>A / 暖白 × 沙岩</h2><p>柔和、溫潤、帶有建築材料的質感。<br>呼應木質、石材、暖色燈光與室內空間。</p><div class="swatches"><span style="background:#faf7f2" title="暖白 #FAF7F2"></span><span style="background:#eee7dc" title="沙岩 #EEE7DC"></span><span style="background:#d5c0a5" title="砂褐 #D5C0A5"></span><span style="background:#332c27" title="深棕炭黑 #332C27"></span></div><a class="full" href="/who?palette=sand" target="_blank" rel="noreferrer">開啟 A 完整畫面 ↗</a></div><div class="screen"><iframe title="A 暖白沙岩實際網站預覽" src="/who?palette=sand&amp;compare=1"></iframe></div></section><section class="option graphite"><div class="option-heading"><h2>B / 冷白 × 石墨</h2><p>俐落、理性、強調專業與結構。<br>呼應玻璃、金屬、清水模與產業建築。</p><div class="swatches"><span style="background:#fafafa" title="冷白 #FAFAFA"></span><span style="background:#eceef0" title="霧灰 #ECEEF0"></span><span style="background:#8493a7" title="鋼灰 #8493A7"></span><span style="background:#20242a" title="石墨 #20242A"></span></div><a class="full" href="/who?palette=graphite" target="_blank" rel="noreferrer">開啟 B 完整畫面 ↗</a></div><div class="screen"><iframe title="B 冷白石墨實際網站預覽" src="/who?palette=graphite&amp;compare=1"></iframe></div></section></main><p class="foot">兩套均為配色提案。正式定稿後可移除右下角配色切換工具。</p><script>const screens=document.querySelectorAll('.screen');const resize=new ResizeObserver(entries=>entries.forEach(e=>e.target.style.setProperty('--scale',e.contentRect.width/1440)));screens.forEach(el=>resize.observe(el));document.querySelectorAll('button[data-page]').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('button[data-page]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));document.querySelectorAll('.option').forEach((option,index)=>{const palette=index===0?'sand':'graphite';const u=new URL(button.dataset.page,location.origin);u.searchParams.set('palette',palette);option.querySelector('.full').href=u.pathname+u.search+u.hash;u.searchParams.set('compare','1');option.querySelector('iframe').src=u.pathname+u.search+u.hash})}));</script></body></html>
